services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    depends_on:
      - minio
      - minio-init
    restart: unless-stopped
    volumes:
      - ${HOST_PNG_ROOT_DIR}:${PNG_ROOT_DIR}:ro
      - sqlite-data:/var/lib/png-browser
      - thumbnail-cache:${THUMBNAIL_CACHE_DIR}
    networks:
      - png-browser

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - png-browser

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - png-browser

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - png-browser

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-medical-images}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set private local/$$MINIO_BUCKET;
      "
    networks:
      - png-browser

  lakefs:
    image: treeverse/lakefs:latest
    command: run
    restart: unless-stopped
    environment:
      LAKEFS_LISTEN_ADDRESS: 0.0.0.0:8000
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_DATABASE_LOCAL_PATH: /home/lakefs/metadata
      LAKEFS_BLOCKSTORE_TYPE: local
      LAKEFS_BLOCKSTORE_LOCAL_PATH: /home/lakefs/data/block
      LAKEFS_BLOCKSTORE_LOCAL_IMPORT_ENABLED: "true"
      LAKEFS_BLOCKSTORE_SIGNING_SECRET_KEY: ${LAKEFS_BLOCKSTORE_SIGNING_SECRET_KEY:-local-lakefs-signing-change-me}
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${LAKEFS_AUTH_ENCRYPT_SECRET_KEY:-local-lakefs-change-me}
      LAKEFS_INSTALLATION_USER_NAME: ${LAKEFS_INSTALLATION_USER_NAME:-admin}
      LAKEFS_INSTALLATION_ACCESS_KEY_ID: ${LAKEFS_INSTALLATION_ACCESS_KEY_ID:-AKIAIOSFODNN7EXAMPLE}
      LAKEFS_INSTALLATION_SECRET_ACCESS_KEY: ${LAKEFS_INSTALLATION_SECRET_ACCESS_KEY:-lakefs-local-secret}
      LAKEFS_GATEWAYS_S3_REGION: us-east-1
      LAKEFS_STATS_ENABLED: "false"
    ports:
      - "${LAKEFS_PORT:-8001}:8000"
    volumes:
      - lakefs-data:/home/lakefs
    networks:
      - png-browser

volumes:
  sqlite-data:
  thumbnail-cache:
  minio-data:
  lakefs-data:

networks:
  png-browser:
    driver: bridge
