[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "png-browser-backend"
version = "0.1.0"
description = "Internal image browsing application backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.1.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pillow>=10.4.0",
  "pydantic-settings>=2.3.4",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.5",
  "watchdog>=4.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
